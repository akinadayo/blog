<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">NeULOG — iOSアプリ・生成AI・Web個人開発の実験ブログ</title>
  <desc id="desc">濃紺のレトロゲーム風背景に、NeULOGとブログのテーマを表示した共有画像</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111429"/>
      <stop offset=".58" stop-color="#1c1d3c"/>
      <stop offset="1" stop-color="#2a2049"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1acd9"/>
      <stop offset=".52" stop-color="#c49cf2"/>
      <stop offset="1" stop-color="#8edbe8"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#8edbe8" stroke-opacity=".09" stroke-width="2"/>
    </pattern>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.7" fill="#f1acd9" fill-opacity=".13"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <circle cx="1030" cy="90" r="240" fill="#8edbe8" opacity=".08"/>
  <circle cx="110" cy="630" r="310" fill="#c49cf2" opacity=".09"/>

  <path d="M55 54H1128L1160 86V576H87L55 544Z" fill="none" stroke="#8edbe8" stroke-width="4"/>
  <path d="M72 72H1118L1142 96" fill="none" stroke="#f1acd9" stroke-width="9"/>
  <path d="M85 565H1115" fill="none" stroke="#c49cf2" stroke-width="8" stroke-dasharray="46 12"/>

  <g transform="translate(92 94)">
    <rect x="8" y="8" width="92" height="92" fill="#8edbe8"/>
    <rect width="92" height="92" fill="url(#brand)" stroke="#dff9ff" stroke-width="5"/>
    <text x="46" y="59" text-anchor="middle" fill="#111429" font-family="Menlo, Monaco, monospace" font-size="35" font-weight="900">N</text>
    <text x="126" y="60" fill="#f4fdff" font-family="Menlo, Monaco, monospace" font-size="40" font-weight="900" letter-spacing="3">NeULOG</text>
    <text x="128" y="88" fill="#8edbe8" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="17" font-weight="700" letter-spacing="2">NEU.DEV / PERSONAL BUILD LOG</text>
  </g>

  <g transform="translate(92 254)">
    <rect width="326" height="42" fill="#eefcff"/>
    <circle cx="24" cy="21" r="7" fill="#f1acd9"/>
    <text x="44" y="28" fill="#111429" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="18" font-weight="800" letter-spacing="1">PLAYER 01 / CREATING</text>

    <text x="0" y="108" fill="#f4fdff" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="51" font-weight="900">iOSアプリ・生成AI・Web</text>
    <text x="0" y="180" fill="#f1acd9" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="57" font-weight="900">個人開発の実験ブログ</text>
    <text x="2" y="236" fill="#bfeef4" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="25" font-weight="700" letter-spacing="3">つくる。壊す。考える。書く。</text>
  </g>

  <g transform="translate(935 392)">
    <rect x="12" y="12" width="150" height="112" rx="12" fill="#8edbe8"/>
    <rect width="150" height="112" rx="12" fill="#1a1d35" stroke="#f1acd9" stroke-width="5"/>
    <rect x="20" y="20" width="110" height="62" rx="6" fill="#c8f0f5" stroke="#8edbe8" stroke-width="4"/>
    <circle cx="42" cy="95" r="9" fill="#c49cf2"/>
    <circle cx="112" cy="95" r="10" fill="#f1acd9"/>
    <circle cx="134" cy="95" r="10" fill="#c49cf2"/>
    <path d="M40 37H110M40 50H96M40 63H116" stroke="#24264a" stroke-width="6"/>
  </g>

  <text x="1100" y="540" text-anchor="end" fill="#f4fdff" font-family="Menlo, Monaco, monospace" font-size="20" font-weight="700" letter-spacing="2">neu-dev.net</text>
